<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>BOM Inspector</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

body{
font-family:Segoe UI;
background:#f2f5f9;
padding:20px;
}

h1{
color:#1a3a5c;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
margin-bottom:20px;
}

button{
padding:10px 15px;
border:none;
background:#1a3a5c;
color:white;
border-radius:6px;
cursor:pointer;
}

input{
padding:10px;
width:250px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
padding:8px;
border-bottom:1px solid #ddd;
text-align:left;
}

.ok{color:green;font-weight:bold;}
.missing{color:red;font-weight:bold;}

</style>
</head>

<body>

<h1>BOM Inspector</h1>

<div class="card">

<h3>Upload BOM Excel</h3>

<input type="file" id="bomFile">

</div>

<div class="card">

<h3>Scan Part</h3>

<input id="scanInput" placeholder="Scan Barcode แล้วกด Enter">

</div>

<div class="card">

<h3>BOM Status</h3>

<table id="bomTable">

<thead>
<tr>
<th>Part No</th>
<th>Required</th>
<th>Scanned</th>
<th>Status</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

<script>

let bom = {}

document.getElementById("bomFile").addEventListener("change", function(e){

let reader = new FileReader()

reader.onload = function(e){

let data = new Uint8Array(e.target.result)
let workbook = XLSX.read(data, {type:'array'})
let sheet = workbook.Sheets[workbook.SheetNames[0]]

let json = XLSX.utils.sheet_to_json(sheet)

json.forEach(r=>{
bom[r.PartNo] = {
qty:r.Qty,
scan:0
}
})

render()

}

reader.readAsArrayBuffer(e.target.files[0])

})

document.getElementById("scanInput").addEventListener("keypress", function(e){

if(e.key==="Enter"){

let code=this.value.trim()

if(bom[code]){

bom[code].scan++

}else{

alert("Unknown Part : "+code)

}

this.value=""

render()

}

})

function render(){

let tbody=document.querySelector("#bomTable tbody")
tbody.innerHTML=""

for(let part in bom){

let row=bom[part]

let status = row.scan>=row.qty ? "OK":"Missing"

let tr=document.createElement("tr")

tr.innerHTML=`
<td>${part}</td>
<td>${row.qty}</td>
<td>${row.scan}</td>
<td class="${status==="OK"?"ok":"missing"}">${status}</td>
`

tbody.appendChild(tr)

}

}

</script>

</body>
</html>
